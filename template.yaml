AWSTemplateFormatVersion: '2010-09-09'
Description: Private raw zone for regional AWS Price List CSV files

Resources:
  RawPriceBucket:
    Type: AWS::S3::Bucket
    DeletionPolicy: Delete
    Properties:
      BucketName: !Sub 'aws-price-lake-raw-${AWS::AccountId}-${AWS::Region}'
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        BlockPublicPolicy: true
        IgnorePublicAcls: true
        RestrictPublicBuckets: true
      Tags:
        - Key: Project
          Value: aws-price-lake
        - Key: DataLayer
          Value: raw

Outputs:
  RawBucketName:
    Description: Name of the raw price-list bucket
    Value: !Ref RawPriceBucket